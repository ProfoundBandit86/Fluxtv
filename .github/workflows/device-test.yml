name: Device test (emulator)

# Runs Flux on an Android emulator, opens titles, the stream list and the player,
# and saves logcat plus screenshots.
#   push to device-test        → quick test: core screens + the parts the change touches (≈10–20 min)
#   push to device-test-full,
#   or "[full]" in the commit  → full test of every screen (≈50 min)
#   Run workflow (Actions tab) → choose quick or full
on:
  push:
    branches: [device-test, device-test-full]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      mode:
        description: 'quick or full'
        default: 'full'
        type: choice
        options: [quick, full]

permissions:
  contents: write

# A newer push replaces a run that's still going (one emulator at a time, especially on the home server).
concurrency:
  group: device-test
  cancel-in-progress: true

jobs:
  emulator:
    # Repo variable FLUX_RUNNER = "unraid" runs this on the home server (.github/runner/README.md); otherwise GitHub's.
    # Only pushes to the test branches and manual runs start it: pull requests never reach the home server.
    runs-on: ${{ vars.FLUX_RUNNER == 'unraid' && fromJSON('["self-hosted","flux-emulator"]') || 'ubuntu-latest' }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Pick quick or full test
        id: mode
        run: |
          MODE=quick
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then MODE="${{ inputs.mode }}"; fi
          if [ "${{ github.ref_name }}" = device-test-full ]; then MODE=full; fi
          if git log -1 --format=%B | grep -qi '\[full\]'; then MODE=full; fi
          # Files changed compared with what's released (main)
          git fetch -q --depth=1 origin main && git diff --name-only FETCH_HEAD HEAD > /tmp/changed.txt || : > /tmp/changed.txt
          echo "Mode: $MODE"; echo "Changed:"; cat /tmp/changed.txt
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          # The second (Android TV) emulator only checks other apps' Home rows
          if [ "$MODE" = full ] || grep -qE 'MainActivity|Blend|WatchNext|HomeRows|HomeLayout' /tmp/changed.txt; then echo "tv=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build test APK
        env:
          FLUX_TEST: '1'
        run: gradle assembleRelease --no-daemon && cp app/build/outputs/apk/release/app-release.apk flux-test.apk

      - name: Enable KVM
        if: runner.environment == 'github-hosted'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: FLUX_TEST_MODE=${{ steps.mode.outputs.mode }} bash .github/device-test.sh

      - name: Run on Android TV emulator (other apps' Home rows)
        if: always() && steps.mode.outputs.tv == '1' && hashFiles('.github/QUICK_HOME') == '' && hashFiles('.github/quick.sh') == ''
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/tv-test.sh

      - name: Push screenshots to the device-test-output branch
        if: always()
        run: |
          cd out
          git init -q -b device-test-output
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "Device test output ${{ github.run_number }} (${{ steps.mode.outputs.mode }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" device-test-output

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-output
          path: out/
