name: Device test (emulator)

# Runs Flux on an Android emulator, opens titles, the stream list and the player,
# and saves logcat plus screenshots. Trigger by pushing to the device-test branch.
on:
  push:
    branches: [device-test]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build test APK
        env:
          FLUX_TEST: '1'
        run: gradle assembleRelease --no-daemon && cp app/build/outputs/apk/release/app-release.apk flux-test.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/device-test.sh

      - name: Push screenshots to the device-test-output branch
        if: always()
        run: |
          cd out
          git init -q -b device-test-output
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "Device test output ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" device-test-output

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-output
          path: out/
