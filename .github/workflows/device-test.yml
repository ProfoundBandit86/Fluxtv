name: Device test (emulator)

# Runs Flux on an Android emulator, opens titles, the stream list and the player,
# and saves logcat plus screenshots. Trigger by pushing to the device-test branch.
on:
  push:
    branches: [device-test]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Google Home SDK (kept private, unlocked with the HOME_SDK_KEY secret)
        env:
          HOME_SDK_KEY: ${{ secrets.HOME_SDK_KEY }}
        run: |
          if [ -n "$HOME_SDK_KEY" ] && [ -f .github/google-home-sdk.tar.gz.enc ]; then
            mkdir -p app/libs/google-home
            openssl enc -d -aes-256-cbc -pbkdf2 -in .github/google-home-sdk.tar.gz.enc -pass env:HOME_SDK_KEY | tar -xz -C app/libs/google-home
            echo "Google Home SDK unpacked: $(ls app/libs/google-home/com/google/android/gms)"
          else
            echo "No HOME_SDK_KEY secret: building without Google Home"
          fi
      - name: Build test APK
        env:
          FLUX_TEST: '1'
        run: gradle assembleRelease --no-daemon && cp app/build/outputs/apk/release/app-release.apk flux-test.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/device-test.sh

      - name: Run on Android TV emulator (other apps' Home rows)
        if: always() && hashFiles('.github/QUICK_HOME') == '' && hashFiles('.github/quick.sh') == ''
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/tv-test.sh

      - name: Push screenshots to the device-test-output branch
        if: always()
        run: |
          cd out
          git init -q -b device-test-output
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "Device test output ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" device-test-output

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-output
          path: out/
