name: Build & release

# Every push to main builds a signed APK and publishes it as a GitHub release (tag v<run number>).
# Installed copies of Flux TV check the latest release when the home screen reloads and update themselves.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME); Gradle fetches anything missing.

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Optional: use a private signing key stored in repo secrets instead of signing/flux-release.jks.
      - name: Private signing key (if configured)
        env:
          KS: ${{ secrets.FLUX_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.FLUX_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.FLUX_KEY_ALIAS }}
          KP: ${{ secrets.FLUX_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/flux.jks"
            {
              echo "FLUX_KEYSTORE=$RUNNER_TEMP/flux.jks"
              echo "FLUX_KEYSTORE_PASSWORD=$KSP"
              echo "FLUX_KEY_ALIAS=$KA"
              echo "FLUX_KEY_PASSWORD=$KP"
            } >> "$GITHUB_ENV"
            echo "Using private signing key from secrets"
          else
            echo "Using signing/flux-release.jks from the repo"
          fi

      - name: Google Home SDK (kept private, unlocked with the HOME_SDK_KEY secret)
        env:
          HOME_SDK_KEY: ${{ secrets.HOME_SDK_KEY }}
        run: |
          if [ -n "$HOME_SDK_KEY" ] && [ -f .github/google-home-sdk.tar.gz.enc ]; then
            mkdir -p app/libs/google-home
            openssl enc -d -aes-256-cbc -pbkdf2 -in .github/google-home-sdk.tar.gz.enc -pass env:HOME_SDK_KEY | tar -xz -C app/libs/google-home
            echo "Google Home SDK unpacked: $(ls app/libs/google-home/com/google/android/gms)"
          else
            echo "No HOME_SDK_KEY secret: building without Google Home"
          fi
      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk flux-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: flux-tv-apk
          path: flux-tv.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" flux-tv.apk \
            --title "Flux TV 1.0.${{ github.run_number }}" \
            --generate-notes --latest
