pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Google Home APIs SDK, if you added it (see app/build.gradle)
        maven { url "${rootDir}/app/libs/google-home" }
    }
}
rootProject.name = "FluxTV"
include ':app'
