plugins {
    id 'com.android.application'
}

// Google Home: Google doesn't publish its Home APIs SDK publicly. Put the files you download from the Google Home
// Developer Console in app/libs/google-home (the .aar files, or the unzipped Maven repository) and the build
// includes the Google Home connection. Without them, Flux builds as usual with Home Assistant only.
def homeDir = file('libs/google-home')
def homeRepo = new File(homeDir, 'com/google/android/gms/play-services-home').exists()
def homeAars = fileTree(dir: homeDir, include: ['**/*.aar']).files.findAll { !homeRepo }
def hasHomeSdk = homeRepo || !homeAars.isEmpty()
if (hasHomeSdk) {
    apply plugin: 'org.jetbrains.kotlin.android'
    println "Google Home SDK found: building with the Google Home connection"
}

android {
    namespace 'com.fluxtv.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fluxtv.app'
        minSdk 24
        targetSdk 35
        // GitHub Actions run number = version, so every push to main is a newer release.
        def build = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionCode build
        versionName "1.0.$build"
        // Emulator test builds (FLUX_TEST=1) let adb open inner screens directly.
        manifestPlaceholders = [testExported: System.getenv('FLUX_TEST') == '1' ? 'true' : 'false']
        buildConfigField 'boolean', 'TEST_BUILD', System.getenv('FLUX_TEST') == '1' ? 'true' : 'false'
    }

    // Every release must be signed with the same key, or Android refuses the update.
    // Uses a private key from GitHub secrets when configured (see README), else signing/flux-release.jks.
    signingConfigs {
        release {
            storeFile file(System.getenv('FLUX_KEYSTORE') ?: "${rootDir}/signing/flux-release.jks")
            storePassword System.getenv('FLUX_KEYSTORE_PASSWORD') ?: 'fluxtv-release'
            keyAlias System.getenv('FLUX_KEY_ALIAS') ?: 'flux'
            keyPassword System.getenv('FLUX_KEY_PASSWORD') ?: 'fluxtv-release'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA']
        }
    }

    sourceSets {
        main {
            java.srcDirs += hasHomeSdk ? 'src/googlehome/java' : 'src/nogooglehome/java'
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    def media3 = '1.5.0'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    // FFmpeg audio decoders (DTS, DTS-HD, TrueHD, AC3/E-AC3, FLAC, ALAC, Opus, Vorbis…) for boxes that can't play them natively
    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:$media3+1"
    implementation "androidx.media3:media3-datasource:$media3"
    if (hasHomeSdk) {
        if (homeRepo) {
            def v = { name -> new File(homeDir, "com/google/android/gms/$name").listFiles().findAll { it.isDirectory() }*.name.max() }
            implementation "com.google.android.gms:play-services-home:${v('play-services-home')}"
            implementation "com.google.android.gms:play-services-home-types:${v('play-services-home-types')}"
        } else {
            implementation files(homeAars)
            // what the SDK needs when it's added as plain .aar files
            implementation 'com.google.android.gms:play-services-base:18.5.0'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
        }
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
        implementation 'androidx.activity:activity-ktx:1.9.3'
    }
    // SMB 2/3 network shares for DVR recordings
    implementation "eu.agno3.jcifs:jcifs-ng:2.1.10"
}
